[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "maxiprot"
description = "Pick the best miniprot alignment per locus from a miniprot GFF3."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Adam Taranto" }]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

dependencies = ["biopython", "numpy", "pandas", "pyfaidx", "rich"]

dynamic = ["version"]

[project.urls]
homepage = "https://github.com/adamtaranto/maxiprot"
documentation = "https://github.com/adamtaranto/maxiprot"
repository = "https://github.com/adamtaranto/maxiprot"
issues = "https://github.com/adamtaranto/maxiprot/issues"
changelog = "https://github.com/adamtaranto/maxiprot/blob/main/CHANGELOG.md"

[project.scripts]
maxiprot = "maxiprot.cli:main"

[tool.hatch.build]
source = "src"

exclude = ["environment.yml", ".github", ".vscode"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.vcs]
tag-pattern = "v*"         # Git tags starting with 'v' will be used for versioning
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/maxiprot/_version.py"

[project.optional-dependencies]
dev = [
    "hatch",
    "mypy",
    "numpydoc-validation",
    "pandas-stubs",
    "pre-commit",
    "ruff",
]

docs = [
    "mkdocs-jupyter",
    "mkdocs-material",
    "mkdocs",
    "mkdocstrings-python",
    "mkdocstrings",
    "notebook",
    "pymdown-extensions",
]

test = ["pytest-cov", "pytest"]

[tool.pytest.ini_options]
addopts = "-v"
# Coverage flags live in CI (pytest --cov=maxiprot --cov-branch --cov-report=xml)
# so a plain local `pytest` does not require pytest-cov.
# Only `tests` is collected by default, so `pytest` never runs the benchmarks.
# Run them explicitly with:  pytest benchmarks/ --codspeed --no-cov
testpaths = ["tests"]
# `bench_*.py` is listed so files under benchmarks/ are collected when that
# directory is named explicitly. No such files exist under tests/.
python_files = ["test_*.py", "bench_*.py"]

[tool.ruff]
# Must match `requires-python` above.
target-version = "py310"
line-length = 88
fix = true

[tool.ruff.lint]
select = [
    "C", # mccabe rules
    "F", # pyflakes rules
    "E", # pycodestyle error rules
    "W", # pycodestyle warning rules
    "B", # flake8-bugbear rules
    "I", # isort rules
    #"D", # pydocstyle rules
]
ignore = [
    "C901", # max-complexity-10
    "E501", # line-too-long
    "I001", # isort-imports
    "B905", # `zip()` without an explicit `strict=` parameter
    "E741", # Ambiguous variable name
]

# Don't auto-fix docstring issues - they're too fragile
unfixable = ["D"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"] # Ignore all pydocstyle rules in tests

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.format]
indent-style = "space"
quote-style = "single"

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["maxiprot"]
known-third-party = ["Bio"]

[tool.numpydoc_validation]
checks = [
    "all",  # report on all checks
    "ES01", # but don't require an extended summary
    "EX01", # or examples
    "SA01", # or a see also section
    "SS06", # and don't require the summary to fit on one line
]
exclude = [ # don't report on checks for these
    '\.__init__$',
    '\.__repr__$',
    '\.__str__$',
]
override_SS05 = [ # allow docstrings to start with these words
    '^Process ',
    '^Assess ',
    '^Access ',
]

# Don't process filepaths that match these regex patterns
exclude_files = [
    '^_version\\.py$',
]

[tool.mypy]
# Type hint strictness settings.
# No pinned python_version: modern numpy stubs use PEP 695 `type` statements,
# which mypy rejects when forced to target < 3.12. The 3.10 floor for our own
# code is enforced by ruff's target-version and the CI test matrix.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pyfaidx.*", "Bio.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pandas-stubs types many chained operations as Any; don't flag returns there.
module = ["maxiprot.filter", "maxiprot.scoring"]
warn_return_any = false

[tool.coverage.run]
branch = true
source = ["maxiprot"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]
