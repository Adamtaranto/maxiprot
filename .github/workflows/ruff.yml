name: Ruff

on: [pull_request]

permissions:
  contents: read

jobs:
  ruff:
    if: ${{ github.actor != 'dependabot[bot]' }} # Do not run on commits created by dependabot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Keep `version` in sync with the ruff-pre-commit rev in
      # .pre-commit-config.yaml so CI and local hooks agree.
      - name: Check formatting
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.1"
          src: './src/maxiprot ./tests'
          args: 'format --check --config=pyproject.toml'
      - name: Lint
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.16.1"
          src: './src/maxiprot ./tests'
          args: 'check --no-fix --config=pyproject.toml'
