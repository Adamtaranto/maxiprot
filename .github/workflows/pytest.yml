name: Python Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: pytest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    # NOTE: no test currently invokes miniprot itself (the integration tests
    # use committed miniprot output under tests/data/). A future end-to-end
    # job could install miniprot from bioconda in a dedicated job.
    steps:
      # Checkout the latest commit associated with the PR
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[test]'

      - name: Test with pytest
        run: pytest --cov=maxiprot --cov-branch --cov-report=xml --cov-report=term

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.13'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: Adamtaranto/maxiprot
          fail_ci_if_error: false

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
      - name: Type-check with mypy
        run: mypy src/maxiprot
